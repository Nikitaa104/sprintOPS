interface:
  display_name: "SprintOPS"
  short_description: "AI-Powered Sprint Orchestration & Operations with approval gates"
  default_prompt: "Use $sprintops to shape sprint scope, triage queues, balance load, inspect sprint health, surface risks, create progress, standup, and retro summaries, and keep owner changes approval-gated."

dependencies:
  tools:
    - type: "mcp"
      value: "mcp-atlassian"
      description: "Atlassian MCP tools for Jira and Confluence operations"

policy:
  allow_implicit_invocation: true
